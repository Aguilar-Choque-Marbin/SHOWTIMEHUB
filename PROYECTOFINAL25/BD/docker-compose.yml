version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: showtime_hub_db
    environment:
      POSTGRES_USER: showtime_admin
      POSTGRES_PASSWORD: showtime2025
      POSTGRES_DB: showtime_hub
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
