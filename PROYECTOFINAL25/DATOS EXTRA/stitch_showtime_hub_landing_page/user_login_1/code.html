<h2 class="text-2xl font-bold tracking-tight">ShowTime Hub</h2>

<h1 class="text-3xl font-bold leading-tight tracking-tight text-white pt-8 pb-2">Bienvenido de Nuevo</h1>
<p class="text-base font-normal leading-normal text-gray-400">Inicia sesión en tu cuenta para continuar</p>
</div>
<form class="space-y-6 pt-8">
<div>
<label class="flex flex-col flex-1">
<p class="text-sm font-medium text-gray-300 pb-2">Correo Electrónico</p>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg bg-gray-900/50 text-gray-100 placeholder:text-gray-500 border border-gray-700 focus:border-primary focus:ring-2 focus:ring-primary/30 h-12 px-4 py-2 text-base font-normal leading-normal" placeholder="tu_nombre@ejemplo.com" type="email" value=""/>
</label>
</div>
<div>
<label class="flex flex-col flex-1">
<div class="flex justify-between items-center pb-2">
<p class="text-sm font-medium text-gray-300">Contraseña</p>
<a class="text-sm font-medium text-primary hover:underline" href="#">¿Olvidaste la Contraseña?</a>
</div>
<div class="relative flex w-full flex-1 items-stretch">
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg bg-gray-900/50 text-gray-100 placeholder:text-gray-500 border border-gray-700 focus:border-primary focus:ring-2 focus:ring-primary/30 h-12 pl-4 pr-10 py-2 text-base font-normal leading-normal" placeholder="Ingresa tu contraseña" type="password" value=""/>
<button class="absolute inset-y-0 right-0 flex items-center pr-3 text-gray-400 hover:text-primary" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</label>
</div>
<div>
<button class="flex w-full min-w-[84px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-12 px-4 bg-primary text-background-dark text-base font-bold leading-normal tracking-wide shadow-sm hover:bg-primary/90 focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-background-dark">
<span class="truncate">Iniciar Sesión</span>
</button>
</div>
</form>
<div class="relative py-6">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-gray-700"></div>
</div>
<div class="relative flex justify-center text-sm">
<span class="bg-background-dark px-2 text-gray-400">O continúa con</span>
</div>
</div>
<div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
<button class="flex h-12 w-full items-center justify-center rounded-lg border border-gray-700 bg-gray-900/50 px-4 text-sm font-medium text-white hover:bg-gray-800/60 focus:outline-none focus:ring-2 focus:ring-white/50 focus:ring-offset-2 focus:ring-offset-background-dark">
<svg class="mr-2 h-5 w-5" fill="currentColor" role="img" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<title>Google</title>

<svg class="mr-2 h-5 w-5" fill="currentColor" role="img" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
