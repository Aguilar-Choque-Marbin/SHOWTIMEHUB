<!DOCTYPE html>
<html class="dark" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Selección de Rol - ShowTime Hub</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Spline+Sans:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "accent": "#00f5d4",
            "background-light": "#f6f6f8",
            "background-dark": "#0a0a0a",
          },
          fontFamily: {
            "display": ["Spline Sans", "sans-serif"]
          },
          borderRadius: {
            "DEFAULT": "1rem",
            "lg": "2rem",
            "xl": "3rem",
            "full": "9999px"
          },
        },
      },
    }
  </script>
<style>
    .material-symbols-outlined {
      font-variation-settings:
        'FILL' 0,
        'wght' 300,
        'GRAD' 0,
        'opsz' 24
    }
  </style>
</head>
<body class="bg-background-light dark:bg-background-dark font-display">
<div class="relative flex h-auto min-h-screen w-full flex-col items-center justify-center bg-background-dark group/design-root overflow-hidden p-4 md:p-6" style='font-family: "Spline Sans", "Noto Sans", sans-serif;'>
<div class="layout-container flex h-full grow flex-col justify-center">
<div class="flex flex-1 items-center justify-center py-5">
<div class="layout-content-container flex flex-col max-w-[960px] flex-1 items-center">
<div class="w-full max-w-lg text-center">
<h1 class="text-gray-50 tracking-light text-[32px] font-bold leading-tight px-4 pb-3 pt-6">¿Cómo quieres usar ShowTime Hub?</h1>
<p class="text-gray-400 text-base font-normal leading-normal pb-3 pt-1 px-4 text-center">Selecciona tu rol para personalizar tu experiencia.</p>
</div>
<div class="mt-8 grid w-full max-w-4xl grid-cols-1 gap-6 md:grid-cols-2">
<div class="group relative flex cursor-pointer flex-col items-center gap-4 rounded-lg border border-gray-800 bg-gray-900/50 p-8 text-center transition-all duration-300 hover:border-accent/50 hover:bg-accent/10">
<div class="flex h-20 w-20 items-center justify-center rounded-full bg-accent/20 text-accent transition-colors duration-300 group-hover:bg-accent group-hover:text-black">
<span class="material-symbols-outlined text-4xl" data-icon="search">search</span>
</div>
<div class="flex flex-col gap-1">
<p class="text-gray-50 text-lg font-bold leading-tight tracking-[-0.015em]">Buscar Artistas</p>
<p class="text-gray-400 text-base font-normal leading-normal">(Soy Cliente)</p>
</div>
<button class="mt-4 flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-full h-10 px-6 bg-accent text-black text-sm font-bold leading-normal opacity-0 transition-opacity duration-300 group-hover:opacity-100">
<span class="truncate">Seleccionar rol</span>
</button>
</div>
<div class="group relative flex cursor-pointer flex-col items-center gap-4 rounded-lg border border-gray-800 bg-gray-900/50 p-8 text-center transition-all duration-300 hover:border-accent/50 hover:bg-accent/10">
<div class="flex h-20 w-20 items-center justify-center rounded-full bg-accent/20 text-accent transition-colors duration-300 group-hover:bg-accent group-hover:text-black">
<span class="material-symbols-outlined text-4xl" data-icon="mic">mic</span>
</div>
<div class="flex flex-col gap-1">
<p class="text-gray-50 text-lg font-bold leading-tight tracking-[-0.015em]">Ofrecer mis Servicios</p>
<p class="text-gray-400 text-base font-normal leading-normal">(Soy Artista)</p>
</div>
<button class="mt-4 flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-full h-10 px-6 bg-accent text-black text-sm font-bold leading-normal opacity-0 transition-opacity duration-300 group-hover:opacity-100">
<span class="truncate">Seleccionar rol</span>
</button>
</div>
</div>
<div class="mt-12">
<p class="text-gray-400 text-sm font-normal leading-normal pb-3 pt-1 px-4 text-center underline cursor-pointer hover:text-accent transition-colors">Continuar más tarde</p>
</div>
</div>
</div>
</div>
</div>

</body></html>
