<h2 class="text-2xl font-bold tracking-tight">ShowTime Hub</h2>
</div>
</div>
<div class="pt-8 text-center">
<h1 class="text-3xl font-bold leading-tight tracking-tight text-white pb-2">Restablece tu Contraseña</h1>
<p class="text-base font-normal leading-normal text-gray-400 max-w-sm mx-auto">Crea una nueva contraseña segura para tu cuenta. Debe tener al menos 8 caracteres.</p>
</div>
<form class="mt-8 space-y-6 text-left">
<div>
<label class="block text-sm font-medium text-gray-300" for="new-password">
                            Nueva Contraseña
                        </label>
<div class="relative mt-2">
<input class="block w-full rounded-lg border-gray-600 bg-gray-800/50 text-white placeholder-gray-500 shadow-sm focus:border-primary focus:ring-primary" id="new-password" name="new-password" placeholder="Ingresa tu nueva contraseña" required="" type="password"/>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center pr-3">
<span class="material-symbols-outlined text-gray-500">lock</span>
</div>
</div>
</div>
<div>
<label class="block text-sm font-medium text-gray-300" for="confirm-password">
                            Confirmar Contraseña
                        </label>
<div class="relative mt-2">
<input class="block w-full rounded-lg border-red-500 bg-gray-800/50 text-white placeholder-gray-500 shadow-sm focus:border-red-500 focus:ring-red-500" id="confirm-password" name="confirm-password" placeholder="Confirma tu nueva contraseña" required="" type="password"/>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center pr-3">
<span class="material-symbols-outlined text-red-500">error_outline</span>
</div>
</div>
<p class="mt-2 text-sm text-red-500">Las contraseñas no coinciden.</p>
</div>
<button class="flex w-full min-w-[84px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-12 px-4 bg-primary text-background-dark text-base font-bold leading-normal tracking-wide shadow-sm hover:bg-primary/90 focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-background-dark" type="submit">
                        Guardar Nueva Contraseña
                    </button>
</form>
<div class="mt-6 text-center">
<a class="text-sm font-medium text-primary hover:underline" href="#">
                        Volver a Iniciar Sesión
                    </a>
</div>
</div>
</div>
</div>
