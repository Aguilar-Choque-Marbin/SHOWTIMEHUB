<!DOCTYPE html>
<html class="dark" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Propuesta Enviada - ShowTime Hub</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "accent": "#00BCD4",
            "background-dark": "#000000",
            "container-dark": "#1A1A1A",
            "input-dark": "#2C2C2C"
          },
          fontFamily: {
            "display": ["Inter", "sans-serif"]
          },
          borderRadius: {
            "DEFAULT": "0.5rem",
            "lg": "1rem",
            "xl": "1.5rem",
            "full": "9999px"
          },
        },
      },
    }
  </script>
<style>
    body {
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
  </style>
</head>
<body class="font-display bg-background-dark text-gray-200">
<div class="relative flex min-h-screen w-full flex-col">
<header class="sticky top-0 z-10 flex w-full items-center justify-start whitespace-nowrap border-b border-solid border-white/10 bg-background-dark px-4 py-3 backdrop-blur-sm sm:px-8 md:px-10 lg:px-20">
<div class="flex items-center gap-3 text-white">
<span class="material-symbols-outlined text-accent text-3xl">
          local_activity
        </span>
<h1 class="text-white text-lg font-bold leading-tight tracking-[-0.015em]">ShowTime Hub</h1>
</div>
</header>
<main class="flex flex-1 flex-col items-center justify-center px-4 py-8 text-center sm:py-12 md:py-16">
<div class="flex w-full max-w-lg flex-col items-center gap-8">
<div class="flex flex-col items-center gap-6">
<span class="material-symbols-outlined text-accent !text-7xl font-light">
          check_circle
        </span>
<h2 class="text-4xl font-black leading-tight tracking-[-0.033em] text-white sm:text-5xl">¡Propuesta Enviada con Éxito!</h2>
<p class="max-w-md text-base text-gray-300 sm:text-lg">El cliente será notificado y revisará tu propuesta. Te avisaremos cuando haya una respuesta.</p>
</div>
<div class="mt-4 flex w-full flex-col items-center gap-4 sm:flex-row sm:justify-center">
<button class="flex h-12 w-full cursor-pointer items-center justify-center gap-2 overflow-hidden rounded-lg bg-accent px-8 text-base font-bold leading-normal tracking-[0.015em] text-white transition-transform duration-200 hover:scale-105 active:scale-100 sm:w-auto">
            Volver al Dashboard
          </button>
<button class="flex h-12 w-full cursor-pointer items-center justify-center gap-2 overflow-hidden rounded-lg border border-accent bg-transparent px-8 text-base font-bold leading-normal tracking-[0.015em] text-accent transition-colors duration-200 hover:bg-accent/10 active:bg-accent/20 sm:w-auto">
            Ver Propuesta Enviada
          </button>
</div>
</div>
</main>
</div>

</body></html>
